# ===========================================
# SUPABASE CONFIGURATION
# ===========================================
# Get these from: https://supabase.com/dashboard/project/YOUR_PROJECT/settings/api
# 
# After creating your Supabase project:
# 1. Go to Project Settings (gear icon)
# 2. Click "API" in sidebar
# 3. Copy the values below

SUPABASE_URL=
SUPABASE_ANON_KEY=
SUPABASE_SERVICE_KEY=

# Example (DON'T use these - get your own!):
# SUPABASE_URL=https://abcdefghijk.supabase.co
# SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFiY2RlZmdoaWprIiwicm9sZSI6ImFub24iLCJpYXQiOjE2ODkwMDAwMDAsImV4cCI6MjAwNDU3NjAwMH0.abcd1234...
