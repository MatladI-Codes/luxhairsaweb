<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | LuxHair ZA</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/style.css">
    
    <style>
        .success-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            overflow: hidden;
        }
        
        .success-card {
            background: var(--card);
            padding: 60px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--gold);
            position: relative;
            z-index: 2;
        }
        
        .success-icon {
            width: 100px;
            height: 100px;
            background: var(--gold);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            animation: scaleIn 0.5s ease;
        }
        
        .success-icon i {
            font-size: 3rem;
            color: #000;
        }
        
        .success-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            color: var(--text);
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .success-message {
            color: var(--muted);
            font-size: 1.1rem;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .order-info {
            background: rgba(193, 160, 70, 0.05);
            padding: 25px;
            margin: 30px 0;
            border: 1px solid rgba(193, 160, 70, 0.2);
        }
        
        .order-number {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .order-id {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--gold);
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 2px;
        }
        
        .order-details {
            text-align: left;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(193, 160, 70, 0.2);
        }
        
        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 0.95rem;
        }
        
        .detail-label {
            color: var(--muted);
        }
        
        .detail-value {
            color: var(--text);
            font-weight: 500;
        }
        
        .actions {
            display: flex;
            gap: 15px;
            margin-top: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .actions .btn {
            flex: 1;
            min-width: 180px;
        }
        
        .pending-notice {
            background: #FFF3CD;
            color: #856404;
            padding: 15px;
            border-radius: 0;
            margin: 20px 0;
            font-size: 0.9rem;
            border: 1px solid #FFEAA7;
        }
        
        /* Confetti Animation */
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--gold);
            position: absolute;
            animation: confetti-fall 3s linear;
            z-index: 1;
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        @keyframes confetti-fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        
        @media (max-width: 768px) {
            .success-card {
                padding: 40px 25px;
            }
            
            .success-title {
                font-size: 2.2rem;
            }
            
            .actions {
                flex-direction: column;
            }
            
            .actions .btn {
                min-width: 100%;
            }
        }
    </style>
</head>
<body data-theme="light">
    <div class="success-container">
        <div class="success-card">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            
            <h1 class="success-title">Order Confirmed!</h1>
            <p class="success-message" id="successMessage">
                Thank you for your purchase. Your order has been received and is being processed.
            </p>
            
            <div id="pendingNotice"></div>
            
            <div class="order-info">
                <div class="order-number">Order Number</div>
                <div class="order-id" id="orderNumber">ORD-XXXXXX</div>
                
                <div class="order-details" id="orderDetails">
                    <!-- Order details will be loaded here -->
                </div>
            </div>
            
            <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 10px;">
                A confirmation email has been sent to <strong id="customerEmail"></strong>
            </p>
            
            <p style="color: var(--muted); font-size: 0.85rem;">
                You can track your order status using the order number above.
            </p>
            
            <div class="actions">
                <a href="index.html" class="btn btn-ghost">
                    <i class="fas fa-home" style="margin-right: 8px;"></i>
                    Back to Home
                </a>
                <a href="index.html#customers" class="btn">
                    <i class="fas fa-star" style="margin-right: 8px;"></i>
                    Leave a Review
                </a>
            </div>
        </div>
    </div>

    <script>
        // Load theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.body.setAttribute('data-theme', savedTheme);
        
        // Get order ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const orderId = urlParams.get('order');
        const status = urlParams.get('status');
        
        // Load order details
        if (orderId) {
            document.getElementById('orderNumber').textContent = orderId;
            
            // Get order from localStorage
            const pendingOrder = JSON.parse(localStorage.getItem('pendingOrder') || '{}');
            const completedOrders = JSON.parse(localStorage.getItem('completedOrders') || '[]');
            const order = completedOrders.find(o => o.orderId === orderId) || pendingOrder;
            
            if (order && order.customer) {
                // Show customer email
                document.getElementById('customerEmail').textContent = order.customer.email;
                
                // Show order details
                const orderDetailsHTML = `
                    <div class="detail-row">
                        <span class="detail-label">Total Amount:</span>
                        <span class="detail-value">R${order.order.total.toFixed(2)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Payment Method:</span>
                        <span class="detail-value">${getPaymentMethodName(order.payment.method)}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Shipping To:</span>
                        <span class="detail-value">${order.shipping.city}, ${order.shipping.province}</span>
                    </div>
                `;
                document.getElementById('orderDetails').innerHTML = orderDetailsHTML;
                
                // Show pending notice if payment is pending
                if (status === 'pending' || order.payment.status === 'pending_payment') {
                    const method = order.payment.method;
                    let notice = '';
                    
                    if (method === 'eft') {
                        notice = `
                            <div class="pending-notice">
                                <strong><i class="fas fa-clock"></i> Payment Pending</strong><br>
                                Please complete your EFT payment using reference: <strong>${orderId}</strong><br>
                                Email proof of payment to: <strong>info@luxhairza.co.za</strong>
                            </div>
                        `;
                    } else if (method === 'cash') {
                        notice = `
                            <div class="pending-notice">
                                <strong><i class="fas fa-clock"></i> Payment Pending</strong><br>
                                Please deposit cash using reference: <strong>${orderId}</strong><br>
                                Email deposit slip to: <strong>info@luxhairza.co.za</strong>
                            </div>
                        `;
                    }
                    
                    document.getElementById('pendingNotice').innerHTML = notice;
                }
            }
        }
        
        // Create confetti effect
        function createConfetti() {
            const colors = ['#C1A046', '#D4B14A', '#A68A3A'];
            const confettiCount = 50;
            
            for (let i = 0; i < confettiCount; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 0.5 + 's';
                    confetti.style.animationDuration = (Math.random() * 2 + 2) + 's';
                    document.querySelector('.success-container').appendChild(confetti);
                    
                    setTimeout(() => {
                        confetti.remove();
                    }, 3000);
                }, i * 30);
            }
        }
        
        // Helper function
        function getPaymentMethodName(method) {
            const methods = {
                'card': 'Credit/Debit Card',
                'eft': 'Bank Transfer (EFT)',
                'cash': 'Cash Deposit'
            };
            return methods[method] || method;
        }
        
        // Start confetti on page load
        window.addEventListener('load', () => {
            createConfetti();
        });
    </script>
</body>
</html>
